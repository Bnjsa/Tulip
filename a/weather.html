<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pronóstico del Clima</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }
    #weather-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      width: 300px;
      text-align: center;
    }
    img {
      width: 50px;
      height: 50px;
    }
    h2 {
      font-size: 1.5em;
      margin: 10px 0;
    }
    p {
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <div id="weather-container">
    <h2>Pronóstico del Clima</h2>
    <p id="location">Cargando...</p>
    <img id="weather-icon" src="" alt="Ícono del clima">
    <p id="temperature">Cargando...</p>
    <p id="description">Cargando...</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
